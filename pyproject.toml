[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-bingo"
version = "0.3.0"
description = "Bingo for LLM-isms, scored against your own Claude transcripts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Marc Lavallee" }]
keywords = ["claude", "llm", "bingo", "cli"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/lavallee/llm-bingo"
Issues = "https://github.com/lavallee/llm-bingo/issues"

[project.scripts]
llm-bingo = "llm_bingo.cli:main"
# Deprecated alias from before the 0.3.0 rename; remove in a later release.
claude-bingo = "llm_bingo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["llm_bingo"]
