name: publish

# Publishes to PyPI when a GitHub release is published.
# Auth is via PyPI Trusted Publishing (OIDC) — no API token stored anywhere.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Check tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python3 -c \
            "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$version" ]; then
            echo "tag $tag != pyproject version $version" >&2
            exit 1
          fi

      - run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # PyPI trusted publisher: project llm-bingo, repo lavallee/llm-bingo,
    # workflow publish.yml, environment pypi. The project was renamed from
    # claude-bingo in 0.3.0, so the owner must register a *pending* publisher
    # for llm-bingo on PyPI before the first release, or this job fails.
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
